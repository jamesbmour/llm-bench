[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmsweep"
version = "1.0.0"
description = "Benchmark agentic, coding, and throughput performance of local LM Studio models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "James" }]
keywords = ["llm", "benchmark", "lmstudio", "tui", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "textual>=1.0",
    "rich>=14.2",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "textual-dev>=1.5",
    "respx>=0.22",
    "pytest-textual-snapshot>=1.0",
]

[project.scripts]
llmsweep = "llmsweep.cli:main"

[project.urls]
Homepage = "https://github.com/jamesbrendamour/llm-bench"
Changelog = "https://github.com/jamesbrendamour/llm-bench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llmsweep"]

[tool.hatch.build.targets.sdist]
include = ["src/llmsweep", "tests", "README.md", "CHANGELOG.md", "LICENSE", "docs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["llmsweep/lmstudio_agent_bench.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PTH", "TID"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/llmsweep", "tests"]
exclude = ["llmsweep/lmstudio_agent_bench\\.py"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
